# Cucumber on the JUnit Platform.
# Any key can be overridden with -D on the Gradle command line.

# Default tag filter.
# Override per run, e.g. -Dcucumber.filter.tags="@smoke"
cucumber.filter.tags=not @wip

# Scenario-level parallelism.
# Safe because all scenario state lives in a PicoContainer-scoped ScenarioContext
# and every test creates its own uniquely named data.
cucumber.execution.parallel.enabled=true
cucumber.execution.parallel.config.strategy=fixed
cucumber.execution.parallel.config.fixed.parallelism=4
cucumber.execution.parallel.config.fixed.max-pool-size=4

# Reporting: Allure results, a standalone Cucumber HTML report, and a short console summary.
# ("pretty" is left out on purpose: with parallel scenarios its output interleaves."
cucumber.plugin=io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, html:build/reports/cucumber/cucumber.html, summary
cucumber.publish.quiet=true
cucumber.junit-platform.naming-strategy=long