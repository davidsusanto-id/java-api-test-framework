# Public Restful-Booker instance.
# Shared with everyone and reset periodically,
# which is why tests create their own uniquely named data and clean up after themselves.
baseUrl=https://restful-booker.herokuapp.com

http.connectTimeoutMs=10000
http.readTimeoutMs=30000

# Free hosting can sleep when idle, so allow time for a cold start.
readiness.timeoutSeconds=90